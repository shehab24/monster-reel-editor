name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

      row:
        description: "Google Sheet Row"
        required: false
        type: string

# Restrict queue to avoid clogging GitHub runners
concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --upgrade yt-dlp

      - name: Download Video
        run: |
          echo "Cleaning up existing input video..."
          rm -f input.mp4

          echo "Downloading new video..."
          
          # Pass cookies secret to cookies.txt securely
          cat << 'EOF' > cookies.txt
          ${{ secrets.YOUTUBE_COOKIES }}
          EOF

          # Download using cookies + fixed JS runtime syntax
          yt-dlp "${{ github.event.inputs.video_url }}" \
            --cookies cookies.txt \
            --js-runtimes node \
            --extractor-args "youtube:player_client=ios,android,web" \
            --force-overwrites \
            -o input.mp4

          # Delete cookies file immediately after download for security
          rm -f cookies.txt

      - name: Verify Download
        run: |
          ls -lh input.mp4
          ffprobe input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          ROW_ID="${{ github.event.inputs.row }}"
          
          if [ -n "$ROW_ID" ]; then
            FILENAME="reel_row_${ROW_ID}_${TIMESTAMP}.mp4"
          else
            FILENAME="reel_${TIMESTAMP}.mp4"
          fi
          
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            "$FILENAME"

      - name: Check Output
        run: |
          ls -lh "$FINAL_FILENAME"
          ffprobe "$FINAL_FILENAME"

      - name: Install Rclone
        run: |
          sudo curl https://rclone.org/install.sh | sudo bash

      - name: Upload to Google Drive
        run: |
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: |
          echo "Video processed and uploaded to Google Drive successfully!"
