name: Edit Reels

on:
  workflow_dispatch:

jobs:
  edit-video:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Edit Reel
        run: |
          ffmpeg \
            -i input.mp4 \
            -i logo.png \
            -i follow_banner.png \
            -filter_complex "
              [0:v]hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[v];

              [v][2:v]overlay=(W-w)/2:H-h[tmp];

              [tmp][1:v]overlay=30:20
            " \
            -map 0:v \
            -map 0:a? \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -movflags +faststart \
            output.mp4

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: edited-video
          path: output.mp4
