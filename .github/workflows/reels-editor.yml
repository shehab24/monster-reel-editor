name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg jq curl python3-pip
          pip3 install --upgrade --no-cache-dir yt-dlp

      - name: Download Video
        run: |
          rm -f input.mp4
          URL="${{ github.event.inputs.video_url }}"
          echo "Processing URL: $URL"

          if [[ "$URL" =~ youtube\.com|youtu\.be ]]; then
            echo "YouTube URL detected. Rotating through proxy list..."

            if [ -z "${{ secrets.PROXY_LIST }}" ]; then
              echo "ERROR: PROXY_LIST secret is missing or empty!"
              exit 1
            fi

            # Read PROXY_LIST secret and shuffle the proxies randomly
            mapfile -t PROXIES < <(echo "${{ secrets.PROXY_LIST }}" | grep -v '^[[:space:]]*$' | shuf)

            DOWNLOAD_SUCCESS=false

            for PROXY in "${PROXIES[@]}"; do
              # Clean carriage returns/spaces
              PROXY=$(echo "$PROXY" | tr -d '\r' | xargs)
              echo "Attempting download using proxy: $(echo "$PROXY" | sed -E 's/:([^@]+)@/:***@/')"

              yt-dlp "$URL" \
                --proxy "$PROXY" \
                --no-playlist \
                -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                --merge-output-format mp4 \
                --force-overwrites \
                --socket-timeout 15 \
                -o input.mp4 || true

              if [ -s input.mp4 ] && [ $(wc -c < input.mp4) -gt 300000 ]; then
                echo "SUCCESS: Video downloaded successfully via proxy!"
                DOWNLOAD_SUCCESS=true
                break
              else
                echo "Proxy attempt failed or timed out. Trying next proxy..."
                rm -f input.mp4
              fi
            done

            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              echo "ERROR: All proxies failed to download the YouTube video."
              exit 1
            fi

          else
            echo "Non-YouTube URL detected (Facebook Reels, etc.). Downloading directly..."
            yt-dlp "$URL" \
              --no-playlist \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --merge-output-format mp4 \
              --force-overwrites \
              -o input.mp4
          fi

      - name: Verify Download
        run: |
          if [ ! -s input.mp4 ]; then
            echo "ERROR: Downloaded input.mp4 is empty or missing!"
            exit 1
          fi
          echo "Video successfully prepared. File details:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          # Scale to slightly larger height and crop with an upward offset (y=120)
          # to push the original bottom captions down cleanly behind the overlay shape
          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:2040:force_original_aspect_ratio=increase,
              crop=1080:1920:0:120[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed, edited, and uploaded to Google Drive!"
