name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg jq curl python3-pip
          pip3 install --upgrade --no-cache-dir yt-dlp

      - name: Download Video
        run: |
          rm -f input.mp4 video_temp.mp4 audio_temp.m4a
          URL="${{ github.event.inputs.video_url }}"
          echo "Processing URL: $URL"

          # Route YouTube URLs through Invidious Stream Proxies
          if [[ "$URL" =~ youtube\.com|youtu\.be ]]; then
            echo "YouTube URL detected."

            VIDEO_ID=$(echo "$URL" | grep -oE '(shorts/|v=)[a-zA-Z0-9_-]{11}' | sed 's/shorts\///' | sed 's/v=//')
            echo "Extracted Video ID: $VIDEO_ID"

            if [ -z "$VIDEO_ID" ]; then
              echo "ERROR: Could not parse YouTube Video ID from URL."
              exit 1
            fi

            # Public Invidious instances that proxy video stream data directly
            INSTANCES=(
              "https://inv.tux.pizza"
              "https://invidious.nerdvpn.de"
              "https://inv.ing.network"
              "https://invidious.drgns.space"
              "https://invidious.privacydev.net"
              "https://yt.artemislena.eu"
            )

            DOWNLOAD_SUCCESS=false

            for INSTANCE in "${INSTANCES[@]}"; do
              echo "Trying proxy instance: $INSTANCE ..."

              # Try 720p (itag 22) first, then 360p/480p (itag 18)
              for ITAG in 22 18; do
                STREAM_URL="${INSTANCE}/latest_version?id=${VIDEO_ID}&itag=${ITAG}&local=true"
                echo "Fetching stream (itag $ITAG) from $INSTANCE ..."

                curl -s -L --max-time 45 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$STREAM_URL" -o input.mp4

                # Verify file exists, is over 300KB, and has valid video stream using ffprobe
                if [ -s input.mp4 ] && [ $(wc -c < input.mp4) -gt 300000 ]; then
                  if ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprintwrappers=1:nokey=1 input.mp4 > /dev/null 2>&1; then
                    echo "SUCCESS: Valid MP4 video downloaded from $INSTANCE (itag $ITAG)!"
                    DOWNLOAD_SUCCESS=true
                    break 2
                  fi
                fi
                echo "Stream from $INSTANCE (itag $ITAG) was invalid or rate-limited. Trying next..."
                rm -f input.mp4
              done
            done

            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              echo "ERROR: All proxy instances failed to return a valid video stream."
              exit 1
            fi

          else
            echo "Non-YouTube URL detected (Facebook Reels, etc.). Using direct yt-dlp..."
            yt-dlp "$URL" \
              --no-playlist \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --merge-output-format mp4 \
              --force-overwrites \
              -o input.mp4
          fi

      - name: Verify Download
        run: |
          if [ ! -s input.mp4 ]; then
            echo "ERROR: Downloaded input.mp4 is empty or missing!"
            exit 1
          fi
          echo "Video successfully prepared. File details:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed, edited, and uploaded to Google Drive!"
