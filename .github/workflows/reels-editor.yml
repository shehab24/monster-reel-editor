name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg jq curl python3-pip
          pip3 install --upgrade --no-cache-dir yt-dlp

      - name: Download Video
        run: |
          rm -f input.mp4 video_temp.mp4 audio_temp.m4a
          URL="${{ github.event.inputs.video_url }}"
          echo "Processing URL: $URL"

          # Check if URL is YouTube
          if [[ "$URL" =~ youtube\.com|youtu\.be ]]; then
            echo "YouTube URL detected. Fetching video via RapidAPI..."

            VIDEO_ID=$(echo "$URL" | grep -oE '(shorts/|v=)[a-zA-Z0-9_-]{11}' | sed 's/shorts\///' | sed 's/v=//')
            echo "Extracted Video ID: $VIDEO_ID"

            if [ -z "$VIDEO_ID" ]; then
              echo "ERROR: Could not parse YouTube Video ID from URL."
              exit 1
            fi

            # 1. First try yt-dlp with iOS/Android client (works on GitHub Actions without cookies)
            echo "Attempting yt-dlp with iOS client..."
            yt-dlp "https://www.youtube.com/watch?v=$VIDEO_ID" \
              --extractor-args "youtube:player_client=ios,android" \
              --no-playlist \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --merge-output-format mp4 \
              --force-overwrites \
              -o input.mp4 || true

            # 2. If yt-dlp failed or output is empty, fall back to Cobalt/Invidious downloaders
            if [ ! -s input.mp4 ]; then
              echo "yt-dlp failed. Using RapidAPI /download service..."

              DL_RESPONSE=$(curl -s -L "https://yt-api.p.rapidapi.com/dl?id=$VIDEO_ID" \
                -H "X-RapidAPI-Key: ${{ secrets.RAPIDAPI_KEY }}" \
                -H "X-RapidAPI-Host: yt-api.p.rapidapi.com")

              # Extract direct download link if available
              DIRECT_LINK=$(echo "$DL_RESPONSE" | jq -r '.formats[]? | select(.hasVideo==true and .hasAudio==true) | .url' | head -n 1)

              if [ -n "$DIRECT_LINK" ] && [ "$DIRECT_LINK" != "null" ]; then
                # Use wget with full browser headers
                wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                  --no-check-certificate \
                  -O input.mp4 "$DIRECT_LINK" || true
              fi
            fi

            # 3. Final Fallback: Download via public Cobalt API instance
            if [ ! -s input.mp4 ]; then
              echo "Attempting download via public proxy API..."
              COBALT_URL=$(curl -s -X POST "https://api.cobalt.tools/api/json" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "{\"url\": \"https://www.youtube.com/watch?v=$VIDEO_ID\"}" | jq -r '.url // empty')

              if [ -n "$COBALT_URL" ] && [ "$COBALT_URL" != "null" ]; then
                curl -s -L "$COBALT_URL" -o input.mp4
              fi
            fi

          else
            echo "Non-YouTube URL detected (Facebook Reels, etc.). Using direct yt-dlp..."
            yt-dlp "$URL" \
              --no-playlist \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --merge-output-format mp4 \
              --force-overwrites \
              -o input.mp4
          fi

      - name: Verify Download
        run: |
          if [ ! -s input.mp4 ]; then
            echo "ERROR: Downloaded input.mp4 is empty or missing!"
            exit 1
          fi
          echo "Video successfully prepared. File details:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed, edited, and uploaded to Google Drive!"
