name: Edit Reels

on:
  workflow_dispatch:

jobs:
  edit-video:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg Version
        run: ffmpeg -version

      - name: Flip Video
        run: |
          ffmpeg -i input.mp4 -vf hflip output.mp4

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: edited-video
          path: output.mp4
