name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg jq curl

      - name: Download Video via Invidious API
        run: |
          rm -f input.mp4
          URL="${{ github.event.inputs.video_url }}"
          
          # Extract 11-character YouTube Video ID
          VIDEO_ID=$(echo "$URL" | grep -oE '(shorts/|v=)[a-zA-Z0-9_-]{11}' | sed 's/shorts\///' | sed 's/v=//')
          echo "Extracted Video ID: $VIDEO_ID"

          if [ -z "$VIDEO_ID" ]; then
            echo "Error: Could not extract Video ID from URL."
            exit 1
          fi

          # 1. Primary Invidious Instance
          echo "Fetching stream URL from Invidious (Primary)..."
          STREAM_URL=$(curl -s "https://inv.tux.pizza/api/v1/videos/$VIDEO_ID" | jq -r '.formatStreams[] | select(.container=="mp4") | .url' | head -n 1)

          # 2. Fallback Invidious Instance if primary fails
          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" == "null" ]; then
            echo "Primary instance busy. Trying secondary instance..."
            STREAM_URL=$(curl -s "https://invidious.nerdvpn.de/api/v1/videos/$VIDEO_ID" | jq -r '.formatStreams[] | select(.container=="mp4") | .url' | head -n 1)
          fi

          if [ -z "$STREAM_URL" ] || [ "$STREAM_URL" == "null" ]; then
            echo "ERROR: Failed to retrieve video stream URL from Invidious instances."
            exit 1
          fi

          echo "Downloading video stream directly..."
          curl -L "$STREAM_URL" -o input.mp4

      - name: Verify Video Download
        run: |
          if [ ! -s input.mp4 ]; then
            echo "Downloaded video file is empty!"
            exit 1
          fi
          echo "Video downloaded successfully. File size:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed and uploaded!"
