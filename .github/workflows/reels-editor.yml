name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg jq curl

      - name: Download Video Stream
        run: |
          rm -f input.mp4

          URL="${{ github.event.inputs.video_url }}"
          echo "Processing URL: $URL"

          # 1. Try downloading via Cobalt API
          echo "Attempting download via Cobalt API..."
          COBALT_RES=$(curl -s -X POST "https://api.cobalt.tools/api/json" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -d "{\"url\": \"$URL\", \"videoQuality\": \"max\"}")

          STREAM_URL=$(echo "$COBALT_RES" | jq -r '.url // empty')

          if [ -n "$STREAM_URL" ] && [ "$STREAM_URL" != "null" ]; then
            echo "Direct stream link obtained from Cobalt."
            curl -L "$STREAM_URL" -o input.mp4
          else
            echo "Cobalt response: $COBALT_RES"
            echo "Cobalt failed or rate-limited. Trying fallback API..."
            
            # 2. Fallback API (Piped instance API)
            VIDEO_ID=$(echo "$URL" | grep -oE '(shorts/|v=)[a-zA-Z0-9_-]{11}' | sed 's/shorts\///' | sed 's/v=//')
            PIPED_RES=$(curl -s "https://pipedapi.kavin.rocks/streams/$VIDEO_ID")
            STREAM_URL=$(echo "$PIPED_RES" | jq -r '.videoStreams[] | select(.mimeType=="video/mp4" and .quality!="LBL") | .url' | head -n 1)

            if [ -n "$STREAM_URL" ] && [ "$STREAM_URL" != "null" ]; then
              echo "Direct stream link obtained from Piped API."
              curl -L "$STREAM_URL" -o input.mp4
            else
              echo "Failed to fetch stream link from fallback sources."
              exit 1
            fi
          fi

      - name: Verify Video
        run: |
          if [ ! -s input.mp4 ]; then
            echo "Downloaded video file is empty!"
            exit 1
          fi
          echo "Video downloaded successfully. Size:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed and uploaded!"
