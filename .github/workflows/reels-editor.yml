name: Edit Reels
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string
concurrency:
  group: reels-processing
  cancel-in-progress: false
jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg curl python3-pip

      - name: Install yt-dlp and PO Token plugin
        run: |
          python3 -m pip install --upgrade yt-dlp
          python3 -m pip install --upgrade bgutil-ytdlp-pot-provider

      - name: Start PO Token Provider Server
        run: |
          docker run -d --rm -p 4416:4416 --name bgutil-provider brainicism/bgutil-ytdlp-pot-provider
          # give the server a moment to come up
          sleep 5
          docker ps

      - name: Download Video via yt-dlp
        run: |
          rm -f input.mp4
          URL="${{ github.event.inputs.video_url }}"

          echo "Downloading: $URL"

          yt-dlp \
            -f "bv*[ext=mp4][height<=1080]+ba[ext=m4a]/b[ext=mp4]/best" \
            --merge-output-format mp4 \
            -o input.mp4 \
            --no-playlist \
            --retries 5 \
            --fragment-retries 5 \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            "$URL"

          if [ ! -s input.mp4 ]; then
            echo "ERROR: yt-dlp failed to download the video."
            exit 1
          fi

          echo "Video downloaded successfully. File size:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV
          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];
              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash

          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed and uploaded!"
