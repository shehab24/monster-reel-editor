name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg curl python3-pip
          pip3 install --upgrade --no-cache-dir yt-dlp

      - name: Download Video Stream
        run: |
          rm -f input.mp4
          
          URL="${{ github.event.inputs.video_url }}"
          echo "Downloading video: $URL"

          # Use YouTube TV HTML5 client extractor (bypasses bot checks & cookies)
          yt-dlp "$URL" \
            --extractor-args "youtube:player_client=tvhtml5,tv" \
            --no-playlist \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            --force-overwrites \
            -o input.mp4

      - name: Verify Download
        run: |
          if [ ! -s input.mp4 ]; then
            echo "Downloaded video file is empty!"
            exit 1
          fi
          echo "Video downloaded successfully. Size:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed and uploaded!"
