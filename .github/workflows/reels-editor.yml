name: Edit Reels

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string

concurrency:
  group: reels-processing
  cancel-in-progress: false

jobs:
  edit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg jq curl python3-pip
          pip3 install --upgrade --no-cache-dir yt-dlp

      - name: Download Video
        run: |
          rm -f input.mp4 video_temp.mp4 audio_temp.m4a
          URL="${{ github.event.inputs.video_url }}"
          echo "Processing URL: $URL"

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # Route YouTube URLs through RapidAPI / Progressive Stream
          if [[ "$URL" =~ youtube\.com|youtu\.be ]]; then
            echo "YouTube URL detected. Using RapidAPI..."

            VIDEO_ID=$(echo "$URL" | grep -oE '(shorts/|v=)[a-zA-Z0-9_-]{11}' | sed 's/shorts\///' | sed 's/v=//')
            echo "Extracted Video ID: $VIDEO_ID"

            if [ -z "$VIDEO_ID" ]; then
              echo "ERROR: Could not parse YouTube Video ID from URL."
              exit 1
            fi

            RESPONSE=$(curl -s -L "https://yt-api.p.rapidapi.com/dl?id=$VIDEO_ID" \
              -H "X-RapidAPI-Key: ${{ secrets.RAPIDAPI_KEY }}" \
              -H "X-RapidAPI-Host: yt-api.p.rapidapi.com")

            # 1. Grab Progressive URL (Combined video+audio format, e.g., itag 18 - guaranteed to download cleanly)
            STREAM_URL=$(echo "$RESPONSE" | jq -r '[.formats[]? | select(.url != null)][0].url // empty')

            # 2. Grab Adaptive URLs as backup
            VIDEO_URL=$(echo "$RESPONSE" | jq -r '[.adaptiveFormats[]? | select(.mimeType | contains("video/mp4"))][0].url // empty')
            AUDIO_URL=$(echo "$RESPONSE" | jq -r '[.adaptiveFormats[]? | select(.mimeType | contains("audio/mp4"))][0].url // empty')

            # Try Progressive single MP4 stream first (Most reliable, no merge errors)
            if [ -n "$STREAM_URL" ] && [ "$STREAM_URL" != "null" ]; then
              echo "Downloading progressive combined MP4 stream..."
              curl -s -L -A "$UA" "$STREAM_URL" -o input.mp4
            fi

            # Check if Progressive download succeeded and is non-empty (>100KB)
            if [ ! -s input.mp4 ] || [ $(wc -c < input.mp4) -lt 100000 ]; then
              echo "Progressive stream failed or was too small. Attempting adaptive stream download & merge..."
              rm -f input.mp4

              if [ -n "$VIDEO_URL" ] && [ -n "$AUDIO_URL" ]; then
                curl -s -L -A "$UA" "$VIDEO_URL" -o video_temp.mp4
                curl -s -L -A "$UA" "$AUDIO_URL" -o audio_temp.m4a

                ffmpeg -y -i video_temp.mp4 -i audio_temp.m4a -c:v copy -c:a aac input.mp4
                rm -f video_temp.mp4 audio_temp.m4a
              fi
            fi

            if [ ! -s input.mp4 ]; then
              echo "API Response: $RESPONSE"
              echo "ERROR: Could not download video stream."
              exit 1
            fi

          else
            echo "Non-YouTube URL detected (Facebook Reels, etc.). Using direct yt-dlp..."
            yt-dlp "$URL" \
              --no-playlist \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --merge-output-format mp4 \
              --force-overwrites \
              -o input.mp4
          fi

      - name: Verify Download
        run: |
          if [ ! -s input.mp4 ]; then
            echo "ERROR: Downloaded input.mp4 is empty or missing!"
            exit 1
          fi
          echo "Video successfully downloaded and prepared. File details:"
          ls -lh input.mp4

      - name: Edit Reel
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="reel_${TIMESTAMP}.mp4"
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

          ffmpeg -y \
            -i input.mp4 \
            -i full-overlay.png \
            -filter_complex "
              [0:v]
              hflip,
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920[video];

              [video][1:v]
              overlay=0:0[out]
            " \
            -map "[out]" \
            -map 0:a? \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FILENAME"

      - name: Install Rclone and Upload
        run: |
          sudo curl -s https://rclone.org/install.sh | sudo bash
          
          rclone copy "$FINAL_FILENAME" :drive: \
            --drive-client-id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            --drive-client-secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            --drive-token='{"access_token":"","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00Z"}' \
            --drive-root-folder-id="16kpxFtM9J0yCYwa1cCC7QHcKPz_INsri"

      - name: Done
        run: echo "Video successfully processed, edited, and uploaded to Google Drive!"
